

services:
  # -------------------------------------
  # 1. Base de datos (PostgreSQL)
  # -------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: omnitrack_db
    restart: always
    environment:
      POSTGRES_DB: omnitrack
      POSTGRES_USER: omnitrack_admin
      POSTGRES_PASSWORD: superpassword123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # -------------------------------------
  # 2. Sistema de mensajería (Redis)
  # -------------------------------------
  redis:
    image: redis:alpine
    container_name: omnitrack_redis
    restart: always
    ports:
      - "6380:6379" 

volumes:
  pgdata: